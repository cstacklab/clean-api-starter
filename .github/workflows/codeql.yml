name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '00 0 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [layered, modular]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ matrix.variant }}/global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Restore
        working-directory: ${{ matrix.variant }}
        run: dotnet restore CleanApiStarter.slnx

      - name: Build
        working-directory: ${{ matrix.variant }}
        run: dotnet build CleanApiStarter.slnx --no-restore --configuration Release /nr:false -v:minimal

      - name: Analyze
        uses: github/codeql-action/analyze@v4
