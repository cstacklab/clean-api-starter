name: Template

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  template:
    name: Verify template output (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: layered
            shortName: clean-api-layered
            package: CleanApiStarter.Template.Layered
          - variant: modular
            shortName: clean-api-modular
            package: CleanApiStarter.Template.Modular

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ${{ matrix.variant }}/global.json

      - name: Sync database
        run: ./scripts/sync-database.sh

      - name: Pack template
        working-directory: ${{ matrix.variant }}
        run: dotnet pack CleanApiStarter.Template.csproj --configuration Release --output ../artifacts

      - name: Install template
        run: dotnet new install artifacts/${{ matrix.package }}.0.0.0.nupkg --force

      - name: Create sample
        run: dotnet new ${{ matrix.shortName }} -n DemoProduct -o artifacts/DemoProduct

      - name: Restore sample
        working-directory: artifacts/DemoProduct
        run: dotnet restore DemoProduct.slnx

      - name: Format sample
        working-directory: artifacts/DemoProduct
        run: dotnet format DemoProduct.slnx --verify-no-changes --no-restore

      - name: Build sample
        working-directory: artifacts/DemoProduct
        run: dotnet build DemoProduct.slnx --no-restore --configuration Release /nr:false -v:minimal

      - name: Test sample
        working-directory: artifacts/DemoProduct
        run: dotnet test DemoProduct.slnx --no-build --configuration Release /nr:false -v:minimal
